name: Download Q2 firmware

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  download-firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest available firmware
        id: firmware
        env:
          QIDI_DEVICE_ID: ${{ secrets.QIDI_DEVICE_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${QIDI_DEVICE_ID:-}" ]]; then
            echo "Repository secret QIDI_DEVICE_ID is required." >&2
            exit 1
          fi

          DEVICE_ID=$(printf '%s' "$QIDI_DEVICE_ID" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          if [[ ! "$DEVICE_ID" =~ ^[0-9A-F]+$ ]]; then
            echo "QIDI_DEVICE_ID must be the hexadecimal CPU serial from /proc/cpuinfo." >&2
            exit 1
          fi

          # Update request signing reverse-engineered by @thelegendtubaguy:
          # https://github.com/thelegendtubaguy/QidiMax4CommunityWiki/blob/main/docs/qidi_client_firmware_update_flow.md
          CURRENT_VERSION="01.01.01.01"
          TIMESTAMP=$(date +%s%3N)
          NONCE=$(openssl rand -hex 16)
          SIGNATURE=$(printf '%s' 'qidi3d null' |
            openssl dgst -sha256 -hmac 'qid3d-from-2025-CAFE-BABE' |
            sed 's/^.* //')

          RESPONSE=$(curl --fail-with-body --silent --show-error --get \
            'https://api.qidimaker.com/backend/v1/fireware/upgrade-info' \
            --data-urlencode 'hardware=QD_Q2' \
            --data-urlencode "currentVersion=$CURRENT_VERSION" \
            --data-urlencode "deviceId=$DEVICE_ID" \
            -H 'Accept: */*' \
            -H 'Accept-Language: en_US' \
            -H 'Content-Type: application/json' \
            -H "X-DeviceId: $DEVICE_ID" \
            -H 'X-DeviceType: Q2' \
            -H "X-Nonce: $NONCE" \
            -H 'X-Platform: 3DPrinter' \
            -H 'X-Region: NA' \
            -H "X-Signature: $SIGNATURE" \
            -H "X-Timestamp: $TIMESTAMP" \
            -H 'X-Timezone: +00:00' \
            -H "X-Version: $CURRENT_VERSION")

          if ! jq -e '.code == 200 and .data.version and .data.url' <<<"$RESPONSE" >/dev/null; then
            jq . <<<"$RESPONSE" >&2
            exit 1
          fi

          VERSION=$(jq -r '.data.version | ltrimstr("V")' <<<"$RESPONSE")
          DOWNLOAD_URL=$(jq -r '.data.url' <<<"$RESPONSE")
          DESCRIPTION=$(jq -r '.data.description // "Firmware update for QIDI Q2"' <<<"$RESPONSE")
          {
            echo "version=$VERSION"
            echo "tag=V$VERSION"
            echo "download_url=$DOWNLOAD_URL"
            echo "description<<__EOF__"
            echo "$DESCRIPTION"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.firmware.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and validate firmware
        if: steps.release.outputs.exists == 'false'
        id: bundle
        env:
          DOWNLOAD_URL: ${{ steps.firmware.outputs.download_url }}
          API_VERSION: ${{ steps.firmware.outputs.version }}
        run: |
          set -euo pipefail

          curl --fail --location --silent --show-error "$DOWNLOAD_URL" -o firmware.zip
          unzip -tq firmware.zip
          unzip -p firmware.zip firmware_manifest.json > firmware-manifest.tmp
          mv firmware-manifest.tmp firmware_manifest.json

          SOC_VERSION=$(jq -er '.SOC.version' firmware_manifest.json)
          if [[ "$SOC_VERSION" != "$API_VERSION" ]]; then
            echo "API version $API_VERSION does not match manifest SOC version $SOC_VERSION." >&2
            exit 1
          fi

          ARCHIVE_FILES=$(unzip -Z1 firmware.zip)
          while IFS= read -r component_file; do
            if ! grep -Fqx "$component_file" <<<"$ARCHIVE_FILES"; then
              echo "Firmware bundle is missing manifest file $component_file." >&2
              exit 1
            fi
          done < <(jq -er '.SOC.file, .MCU.file, .THR.file, .BOX.file' firmware_manifest.json)

          {
            echo "soc_version=$SOC_VERSION"
            echo "mcu_version=$(jq -er '.MCU.version' firmware_manifest.json)"
            echo "thr_version=$(jq -er '.THR.version' firmware_manifest.json)"
            echo "box_version=$(jq -er '.BOX.version' firmware_manifest.json)"
            echo "sha256=$(sha256sum firmware.zip | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.firmware.outputs.tag }}
          name: Firmware ${{ steps.firmware.outputs.tag }}
          body: |
            ${{ steps.firmware.outputs.description }}

            | Component | Version |
            | --- | --- |
            | SOC | ${{ steps.bundle.outputs.soc_version }} |
            | MCU | ${{ steps.bundle.outputs.mcu_version }} |
            | THR | ${{ steps.bundle.outputs.thr_version }} |
            | BOX | ${{ steps.bundle.outputs.box_version }} |

            Source: ${{ steps.firmware.outputs.download_url }}

            SHA-256: `${{ steps.bundle.outputs.sha256 }}`

            ---

            **Note:** The firmware.zip file is the property of QIDI Tech. Copyright © 2025 QIDI Tech All Rights Reserved.

            This repository only automates the distribution of official firmware releases.
          files: firmware.zip
          draft: false
          prerelease: false
